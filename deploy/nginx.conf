user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name printhive.local.home orcaslicer.local.home _;

        location = /cert {
            alias /etc/nginx/certs/printhive.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="printhive.crt"';
        }

        location = /printhive.crt {
            alias /etc/nginx/certs/printhive.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="printhive.crt"';
        }

        location = /cert/printhive.mobileconfig {
            alias /etc/nginx/certs/printhive.mobileconfig;
            default_type application/x-apple-aspen-config;
            add_header Content-Disposition 'attachment; filename="printhive.mobileconfig"';
        }

        location = /printhive.mobileconfig {
            alias /etc/nginx/certs/printhive.mobileconfig;
            default_type application/x-apple-aspen-config;
            add_header Content-Disposition 'attachment; filename="printhive.mobileconfig"';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name printhive.local.home _;

        ssl_certificate     /etc/nginx/certs/printhive.crt;
        ssl_certificate_key /etc/nginx/certs/printhive.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 500M;

        location = /cert {
            alias /etc/nginx/certs/printhive.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="printhive.crt"';
        }

        location = /printhive.crt {
            alias /etc/nginx/certs/printhive.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="printhive.crt"';
        }

        location = /cert/printhive.mobileconfig {
            alias /etc/nginx/certs/printhive.mobileconfig;
            default_type application/x-apple-aspen-config;
            add_header Content-Disposition 'attachment; filename="printhive.mobileconfig"';
        }

        location = /printhive.mobileconfig {
            alias /etc/nginx/certs/printhive.mobileconfig;
            default_type application/x-apple-aspen-config;
            add_header Content-Disposition 'attachment; filename="printhive.mobileconfig"';
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    server {
        listen 443 ssl;
        server_name orcaslicer.local.home;

        ssl_certificate     /etc/nginx/certs/printhive.crt;
        ssl_certificate_key /etc/nginx/certs/printhive.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 500M;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
